<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অফলাইন — EduDirectory BD</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #1D4ED8;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.4;
    }
    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
    }
    button {
      background: #1D4ED8;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1E40AF; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">EduDirectory BD · অফলাইন মোড</div>
    <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন রয়েছে</h1>
    <p>আপনি পূর্বে দেখা শিক্ষা প্রতিষ্ঠানের তথ্য অফলাইন ক্যাশ থেকে ডিরেক্টরি পেজে দেখতে পারবেন। নতুন তথ্য পেতে ইন্টারনেট সংযোগ পুনরায় চালু করে চেষ্টা করুন।</p>
    <button onclick="window.location.href='/'">ডিরেক্টরিতে ফিরে যান</button>
  </main>
</body>
</html>
